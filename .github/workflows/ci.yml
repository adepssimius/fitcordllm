name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  PNPM_VERSION: '11.17.0'
  NODE_VERSION: '24'

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Not --prod: the image's runtime stage installs production deps
      # separately, and the Agent SDK's Claude Code binary is an *optional*
      # dependency — never pass --no-optional here or in the Dockerfile, or the
      # build succeeds and the container dies at startup on a missing binary.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Covers both tsconfigs; the test one type-checks the specs themselves.
      - name: Typecheck
        run: pnpm typecheck

      # The workspace tests run real git against a bare repository on disk:
      # what lands on the base branch is the thing worth being sure about.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Publish container image
    needs: test
    # Every push to main publishes, not just tags. Pull requests never publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Required for `cache-to: type=gha` below: the runner's default buildx
      # driver is `docker`, which cannot export a cache at all.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main builds get `main-<run number>-<short sha>`; explicit tags publish
      # under the tag verbatim. The run number is monotonic by construction, so
      # a deploy tool can sort on it numerically without depending on
      # fixed-width formatting.
      - name: Compute image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${{ github.run_number }}-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          echo "Published \`ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}\`" \
            >> "$GITHUB_STEP_SUMMARY"
